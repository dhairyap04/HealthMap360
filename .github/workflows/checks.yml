name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: healthmap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d healthmap_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/healthmap_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv ../backend/.venv
      - run: ../backend/.venv/bin/pip install -r ../backend/requirements-dev.txt
      - run: npm ci
      - run: npm run build && npm run lint && npm run format:check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-disposable-database-password
      APP_DATABASE_PASSWORD: ci-disposable-application-password
      SECRET_KEY: ci-disposable-signing-secret-only-1234567890
    steps:
      - uses: actions/checkout@v4
      - name: Build and start production services
        run: docker compose --env-file /dev/null -p healthmap_ci -f docker-compose.production.yml up --build -d --wait --wait-timeout 180
      - name: Verify frontend and database readiness through the API proxy
        run: |
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/api/health
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file /dev/null -p healthmap_ci -f docker-compose.production.yml logs
      - name: Remove disposable services
        if: always()
        run: docker compose --env-file /dev/null -p healthmap_ci -f docker-compose.production.yml down -v
